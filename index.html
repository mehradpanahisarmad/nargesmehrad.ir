<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عروسی نرگس و مهراد</title>
    
    <!-- فونت اصلی (وزیرمتن) -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* تنظیمات کلی */
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background-color: #f9f6f0;
            color: #4a4a4a;
            text-align: center;
            margin: 0;
            padding: 20px;
            line-height: 1.8;
            direction: rtl;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #eaddcf;
        }
        /* تیتر و اسم‌ها */
        .bismillah {
            font-size: 1.1em;
            color: #c9a96a;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.5em;
            color: #b8860b;
            margin: 10px 0 20px 0;
            font-weight: 700;
        }
        /* تایمر شمارش معکوس - اصلاح نهایی */
        #countdown {
            display: flex;
            flex-direction: row; /* ترتیب عادی */
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            font-weight: 700;
            color: #b8860b;
            direction: ltr; /* اجبار به چپ به راست */
        }
        #countdown div {
            background: #fdfaf6;
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid #eaddcf;
            min-width: 60px;
        }
        #countdown span {
            display: block;
            font-size: 1.5em;
        }
        #countdown small {
            font-size: 0.8em;
            color: #888;
        }
        /* عکس اصلی */
        .couple-photo {
            max-width: 100%;
            border-radius: 12px;
            margin: 20px 0;
            border: 3px solid #eaddcf;
        }
        /* تصویر تایپوگرافی (شعر) */
        .typography-image {
            max-width: 90%;
            height: auto;
            border: none;
            box-shadow: none;
            margin: 30px auto;
            display: block;
        }
        /* متن دعوت‌نامه */
        .invitation-text {
            font-size: 1.1em;
            margin: 20px 0;
            color: #555;
        }
        .families {
            font-size: 1.2em;
            font-weight: 700;
            color: #c9a96a;
            margin-top: 30px;
        }
        /* پخش‌کننده موسیقی */
        audio {
            width: 100%;
            margin: 20px 0;
            border-radius: 30px;
        }
        /* دکمه‌های ناوبری */
        .navigation {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .nav-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9em;
            transition: transform 0.2s;
            flex: 1;
            min-width: 120px;
        }
        .nav-btn:active {
            transform: scale(0.95);
        }
        .nav-btn svg {
            width: 20px;
            height: 20px;
            margin-left: 8px;
            fill: currentColor;
        }
        .google { background-color: #4285F4; }
        .balad { background-color: #0055A4; }
        .neshan { background-color: #00A651; }
        
        .footer {
            margin-top: 40px;
            font-size: 0.8em;
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="container">
    
    <p class="bismillah">به نام ایزد مهر آفرین</p>
    
    <h1>نرگس و مهراد</h1>

    <!-- تایمر شمارش معکوس - ترتیب از چپ به راست: روز، ساعت، دقیقه، ثانیه -->
    <div id="countdown">
        <div><span id="days">0</span><small>روز</small></div>
        <div><span id="hours">0</span><small>ساعت</small></div>
        <div><span id="minutes">0</span><small>دقیقه</small></div>
        <div><span id="seconds">0</span><small>ثانیه</small></div>
    </div>

    <!-- عکس اصلی -->
    <img src="couple.jpg" alt="عکس نرگس و مهراد" class="couple-photo">

    <!-- شعر به صورت تصویر تایپوگرافی -->
    <img src="typography.png" alt="شعر عروسی" class="typography-image">

    <!-- متن دعوت‌نامه -->
    <p class="invitation-text">
        رونق بهاری ترین ثانیه های زندگی ما باشید تا لطف حضور شما شادیمان را افزون کند.
    </p>

    <!-- موسیقی -->
    <p style="font-size: 0.9em; color: #888; margin-top: 20px;">🎵 آهنگ تانگوی ما را بشنوید</p>
    <audio controls>
        <source src="tango.mp3" type="audio/mpeg">
        مرورگر شما از پخش صدا پشتیبانی نمی‌کند.
    </audio>

    <!-- دکمه‌های ناوبری -->
    <div class="navigation">
        <!-- Google Maps -->
        <a href="https://www.google.com/maps/search/?api=1&query=35.72682143932375,51.53416884753732" target="_blank" class="nav-btn google">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            گوگل مپ
        </a>
        
        <!-- Balad -->
        <a href="https://balad.ir/location?latitude=35.72682143932375&longitude=51.53416884753732" target="_blank" class="nav-btn balad">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            بلد
        </a>

        <!-- Neshan -->
        <a href="https://nshn.ir/?lat=35.72682143932375&lng=51.53416884753732" target="_blank" class="nav-btn neshan">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            نشان
        </a>
    </div>

    <div class="families">پناهی - نوروزی</div>

    <div class="footer">
        با عشق، نرگس و مهراد
    </div>

</div>

<!-- اسکریپت تایمر شمارش معکوس -->
<script>
    // تاریخ عروسی: 30 مهر 1405 ساعت 19:00 به وقت تهران
    const weddingDate = new Date("2026-10-22T19:00:00+03:30").getTime();

    const timer = setInterval(function() {
        const now = new Date().getTime();
        const distance = weddingDate - now;

        if (distance < 0) {
            clearInterval(timer);
            document.getElementById("countdown").innerHTML = "<h3>امروز روز عروسی ماست! 🎉</h3>";
            return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("days").innerText = days;
        document.getElementById("hours").innerText = hours;
        document.getElementById("minutes").innerText = minutes;
        document.getElementById("seconds").innerText = seconds;
    }, 1000);
</script>

</body>
</html>
