<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عروسی نرگس و مهراد</title>

    <!-- فونت اصلی (وزیرمتن) -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* تنظیمات کلی */
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            color: #f5ecd8;
            text-align: center;
            margin: 0;
            padding: 20px;
            line-height: 1.8;
            direction: rtl;
            background: #17130f;
        }

        /* 🖼️ والپیپر پشت کل صفحه (روی آیفون هم درست کار می‌کند) */
        body::before {
            content: "";
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: -1;
            /* عدد اول و دوم (۰.۴۵ و ۰.۶۵) میزان تیرگی روی عکس است؛ برای روشن‌تر شدن عکس کمتر کنید */
            background:
                linear-gradient(rgba(10,8,6,0.5), rgba(10,8,6,0.15)),
                url('wallpaper.jpg') center / cover no-repeat;
        }

        /* بدون کادر سفید؛ فقط محتوا */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* تیتر و اسم‌ها */
        .bismillah-image {
            max-width: 40%;
            height: auto;
            display: block;
            margin: 0 auto 20px auto;
            border: none;
            box-shadow: none;
            /* اگر تصویر بسم‌الله رنگ تیره دارد و روی عکس دیده نمی‌شود، خط زیر را فعال کنید تا سفید شود */
            /* filter: brightness(0) invert(1); */
        }
        h1 {
            font-size: 2.5em;
            color: #e3c987;
            margin: 10px 0 20px 0;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
        }
        /* تایمر شمارش معکوس */
        #countdown {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            font-weight: 700;
            color: #e3c987;
            direction: ltr;
        }
        #countdown div {
            background: rgba(0, 0, 0, 0.35);
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid rgba(227, 201, 135, 0.6);
            min-width: 60px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        #countdown span {
            display: block;
            font-size: 1.5em;
        }
        #countdown small {
            font-size: 0.8em;
            color: #e9dcc0;
        }
        /* تصویر تایپوگرافی (شعر) */
        .typography-image {
            max-width: 90%;
            height: auto;
            border: none;
            box-shadow: none;
            margin: 30px auto;
            display: block;
            /* اگر شعر تیره است و روی عکس خوانا نیست، خط زیر را فعال کنید تا سفید شود */
            /* filter: brightness(0) invert(1); */
        }
        /* تصاویر متن دعوت‌نامه و زمان/مکان */
        .text-image {
            max-width: 90%;
            height: auto;
            display: block;
            margin: 30px auto;
            border: none;
            box-shadow: none;
            /* اگر نوشته تیره است و روی عکس خوانا نیست، خط زیر را فعال کنید تا سفید شود */
            /* filter: brightness(0) invert(1); */
        }
        .families {
            font-size: 1.2em;
            font-weight: 700;
            color: #e3c987;
            margin-top: 30px;
            text-shadow: 0 1px 8px rgba(0,0,0,0.7);
        }
        /* پخش‌کننده موسیقی */
        audio {
            width: 100%;
            margin: 20px 0;
            border-radius: 30px;
        }
        /* دکمه‌های ناوبری */
        .navigation {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .nav-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9em;
            transition: transform 0.2s;
            flex: 1;
            min-width: 120px;
        }
        .nav-btn:active {
            transform: scale(0.95);
        }
        .nav-btn svg {
            width: 20px;
            height: 20px;
            margin-left: 8px;
            fill: currentColor;
        }
        .google { background-color: #4285F4; }
        .balad { background-color: #0055A4; }
        .neshan { background-color: #00A651; }

        .footer {
            margin-top: 40px;
            font-size: 0.8em;
            color: #d8ccb4;
            text-shadow: 0 1px 6px rgba(0,0,0,0.7);
        }

        /* صفحه پوشش (برای شروع موسیقی با اولین لمس) */
        #cover {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 999;
            background: #f9f6f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            cursor: pointer;
            transition: opacity 0.8s ease;
            -webkit-tap-highlight-color: transparent;
        }
        #cover.hide {
            opacity: 0;
            pointer-events: none;
        }
        #cover h2 {
            color: #b8860b;
            font-size: 2.2em;
            margin: 0;
            font-weight: 700;
        }
        #cover p {
            color: #888;
            margin: 0;
        }
    </style>
</head>
<body>

<!-- صفحه پوشش: با لمس آن موسیقی پخش می‌شود و دعوت‌نامه نمایش داده می‌شود -->
<div id="cover">
    <h2>نرگس و مهراد</h2>
    <p>برای مشاهده دعوتنامه لمس کنید</p>
</div>

<div class="container">

    <!-- تصویر بسم الله -->
    <img src="bismillah.png" alt="به نام ایزد مهر آفرین" class="bismillah-image">

    <h1>نرگس و مهراد</h1>

    <!-- تایمر شمارش معکوس -->
    <div id="countdown">
        <div><span id="days">۰</span><small>روز</small></div>
        <div><span id="hours">۰</span><small>ساعت</small></div>
        <div><span id="minutes">۰</span><small>دقیقه</small></div>
        <div><span id="seconds">۰</span><small>ثانیه</small></div>
    </div>

    <!-- شعر به صورت تصویر تایپوگرافی -->
    <img src="typography.png" alt="شعر عروسی" class="typography-image">

    <!-- متن دعوت‌نامه (تصویر) -->
    <img src="body.png" alt="رونق بهاری ترین ثانیه های زندگی ما باشید تا لطف حضور شما شادیمان را افزون کند" class="text-image">

    <!-- تاریخ، مکان و آدرس (تصویر) -->
    <img src="time.png" alt="زمان: ۳۰ مهر ۱۴۰۵، ساعت ۱۹:۰۰ - مکان: تالار پذیرایی داریوش - آدرس: تهرانپارس - انتهای بلوار پروین - بلوار شاهد - نرسیده به خیابان دماوند لاین کند رو" class="text-image">

    <!-- موسیقی (با لمس صفحه پوشش شروع می‌شود) -->
    <audio id="weddingMusic" controls loop preload="auto">
        <source src="tango.mp3" type="audio/mpeg">
        مرورگر شما از پخش صدا پشتیبانی نمی‌کند.
    </audio>

    <!-- دکمه‌های ناوبری -->
    <div class="navigation">
        <!-- Google Maps -->
        <a href="https://www.google.com/maps/search/?api=1&query=35.72682143932375,51.53416884753732" target="_blank" class="nav-btn google">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            گوگل مپ
        </a>

        <!-- Balad -->
        <a href="https://balad.ir/location?latitude=35.72682143932375&longitude=51.53416884753732" target="_blank" class="nav-btn balad">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            بلد
        </a>

        <!-- Neshan -->
        <a href="https://nshn.ir/?lat=35.72682143932375&lng=51.53416884753732" target="_blank" class="nav-btn neshan">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            نشان
        </a>
    </div>

    <div class="families">پناهی - نوروزی</div>

    <div class="footer">
        با عشق، نرگس و مهراد
    </div>

</div>

<script>
    // --- بخش اول: تایمر شمارش معکوس ---
    // تبدیل اعداد انگلیسی به اعداد فارسی
    function toFa(n) {
        return String(n).replace(/\d/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹"[d]; });
    }

    const weddingDate = new Date("2026-10-22T19:00:00+03:30").getTime();

    const timer = setInterval(function () {
        const now = new Date().getTime();
        const distance = weddingDate - now;

        if (distance < 0) {
            clearInterval(timer);
            document.getElementById("countdown").innerHTML = "<h3>امروز روز عروسی ماست! 🎉</h3>";
            return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("days").innerText = toFa(days);
        document.getElementById("hours").innerText = toFa(hours);
        document.getElementById("minutes").innerText = toFa(minutes);
        document.getElementById("seconds").innerText = toFa(seconds);
    }, 1000);

    // --- بخش دوم: پخش موسیقی با لمس صفحه پوشش ---
    const audio = document.getElementById("weddingMusic");
    const cover = document.getElementById("cover");

    // اگر مرورگر اجازه پخش خودکار بدهد، صفحه پوشش همان لحظه بسته می‌شود
    audio.play().then(function () {
        cover.remove();
    }).catch(function () {
        // در غیر این صورت منتظر لمس کاربر می‌مانیم
    });

    cover.addEventListener("click", function () {
        audio.play().catch(function () {});
        cover.classList.add("hide");
        setTimeout(function () { cover.remove(); }, 900);
    });
</script>

</body>
</html>
